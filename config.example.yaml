# Пример конфигурации CloudMaker.
# Скопируйте в config.yaml и поправьте пути при необходимости.

backend: virtualbox

libvirt:
  uri: qemu:///system

storage:
  images_dir: ./data/images
  disks_dir: ./data/disks
  xml_dir: ./data/xml

vm:
  vcpus: 1
  memory_mb: 512
  disk_gb: 4

virtualbox:
  vm_folder: ./data/vbox
