# Локальная конфигурация CloudMaker.

libvirt:
  uri: qemu:///system

storage:
  images_dir: ./data/images
  disks_dir: ./data/disks
  xml_dir: ./data/xml
  state_file: ./data/state.json
  seed_dir: ./data/seeds

vm:
  vcpus: 1
  memory_mb: 512
  disk_gb: 4

network:
  name: cloudmaker
  bridge: br-cloudmaker-typo
  cidr: 192.168.100.0/24
  gateway: 192.168.100.1
